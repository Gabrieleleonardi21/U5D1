# [.properties] dice a Spring in che formato leggere il file (env.local non ha estensione)
# optional: evita il crash all'avvio se il file non esiste (es. su un altro pc / in produzione)
spring.config.import=optional:file:env.local[.properties]
spring.application.name=U5D1
spring.datasource.url=jdbc:postgresql://localhost:5432/geolocalizzazione
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Geocoding API v4: host geocode.googleapis.com, NON maps.googleapis.com.
# Sui progetti dove e' abilitata solo la v4, la vecchia /maps/api/geocode/json
# risponde REQUEST_DENIED con un messaggio fuorviante che parla di fatturazione.
# La chiave vera sta in env.local (ignorato da git): qui c'e' solo il riferimento.
# Il default vuoto dopo i ':' evita che l'app non parta su un pc senza chiave
google.geocoding.api-key=${GOOGLE_API_KEY:}

# Senza timeout una chiamata a Google che non risponde bloccherebbe il thread all'infinito.
# In Boot 4 il prefisso e' spring.http.clients (plurale): il singolare e' deprecato
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=5s

server.port=3001