# [.properties] dice a Spring in che formato leggere il file (env.local non ha estensione)
# optional: evita il crash all'avvio se il file non esiste (es. su un altro pc / in produzione)
spring.config.import=optional:file:env.local[.properties]
spring.application.name=U5D1
spring.datasource.url=jdbc:postgresql://localhost:5432/geolocalizzazione
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=3001